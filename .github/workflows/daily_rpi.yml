name: Daily RPI Update

on:
  schedule:
    - cron: '0 9 * * *'   # 4:00 AM Central (UTC-5)
  workflow_dispatch:

jobs:
  run-rpi-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configure git and pull latest
        run: |
          git config user.name "RPI Bot"
          git config user.email "bankston.jeff@gmail.com"
          git config merge.ours.driver true
          git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RPI bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python southern_miss_rpi_bot.py --llm --no-open --html index.html

      - name: Commit and push updated dashboard
        run: |
          git add index.html daily_brief.txt bot_log.txt southern_miss_rpi_bot.py
          git add -f southern_miss_rpi.db
          git diff --staged --quiet || git commit -m "Daily RPI update $(date +'%Y-%m-%d')"
          git push

      - name: Send daily email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python send_email.py

      - name: Send SMS updates
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
        run: python send_sms.py
