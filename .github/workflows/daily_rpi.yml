name: Daily RPI Update

on:
  schedule:
    - cron: '0 11 * * *'  # 5:00 AM Central (UTC-6)
  workflow_dispatch:

jobs:
  run-rpi-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RPI bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python southern_miss_rpi_bot.py --llm --no-open

      - name: Commit and push updated dashboard
        run: |
          git config user.name "RPI Bot"
          git config user.email "bankston.jeff@gmail.com"
          git add daily_dashboard.html southern_miss_rpi.db daily_brief.txt bot_log.txt
          git diff --staged --quiet || git commit -m "Daily RPI update $(date +'%Y-%m-%d')"
          git push

      - name: Send daily email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python send_email.py
